<!DOCTYPE HTML>
<html>
    <head>
        <title>Contact — linghux</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
        <link rel="stylesheet" href="../assets/css/main.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
        <noscript><link rel="stylesheet" href="../assets/css/noscript.css" /></noscript>
    </head>
    <body>
        <!-- Header -->
            <header id="header">
                <h1>linghux</h1>
                <nav>
                    <ul>
                        <li><a href="../">Home</a></li>
                        <li><a href="../portfolio/">Portfolio</a></li>
                        <li><a href="../about/">About Me</a></li>
                        <li><a href="../contact/">Contact</a></li>
                    </ul>
                </nav>
            </header>

        <!-- Contact -->
            <section id="contact" class="main style3 secondary">
                <div class="content">
                    <header>
                        <h2>Connect With Me</h2>
                    </header>
                    <div class="box">
                        <form id="contact-form">
                            <div class="fields">
                                <div class="field half"><input type="text" name="name" placeholder="Name" /></div>
                                <div class="field half"><input type="email" name="email" placeholder="Email" /></div>
                                <div class="field"><textarea name="message" placeholder="Message" rows="6"></textarea></div>
                            </div>
                            <ul class="actions special">
                                <button type="submit">Send</button>
                            </ul>
                        </form>
                    </div>
                </div>
            </section>

        <!-- Footer -->
            <footer class="footer">
                <div class="footer-content">
                    <div class="social-links">
                        <a href="https://instagram.com/linghu_x_" target="_blank" class="social-link instagram"><i class="fab fa-instagram"></i><span>linghu_x_</span></a>
                        <a href="https://youtube.com/@linghux" target="_blank" class="social-link youtube"><i class="fab fa-youtube"></i><span>linghux</span></a>
                    </div>
                    <p>&copy; 2025 linghux</p>
                </div>
            </footer>

        <!-- Scripts -->
            <script src="../assets/js/jquery.min.js"></script>
            <script src="../assets/js/jquery.poptrox.min.js"></script>
            <script src="../assets/js/jquery.scrolly.min.js"></script>
            <script src="../assets/js/jquery.scrollex.min.js"></script>
            <script src="../assets/js/browser.min.js"></script>
            <script src="../assets/js/breakpoints.min.js"></script>
            <script src="../assets/js/util.js"></script>
            <script src="../assets/js/main.js"></script>

            <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
            <script>
            (function() {
                emailjs.init("YTeXmNaw2azaNGfuH");
            })();

            document.getElementById('contact-form').addEventListener('submit', function(e) {
                e.preventDefault();

                emailjs.sendForm('service_1bbz9d9', 'template_584scza', this)
                .then(function() {
                    alert('Message sent successfully!');
                }, function(error) {
                    alert('Failed to send message:\n' + JSON.stringify(error));
                });
            });
            </script>
    </body>
</html>
